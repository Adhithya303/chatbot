services:
  - type: web
    name: economic-surveyer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.ingest
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

